# config/config.yaml — несекретные настройки Джарвиса (раунд 21, A4).
#
# Секреты (API-ключи) СЮДА НЕ ПИШЕМ — они в .env (см. .env.example рядом
# с этим файлом, в корне проекта). Этот файл можно спокойно класть в git.
#
# Приоритет, если одна и та же настройка задана в нескольких местах (выше
# в списке — главнее): переменная окружения, уже экспортированная в
# текущем shell -> .env -> этот файл -> дефолт в коде. Так что если у тебя
# уже настроено через export в ~/.bashrc — можно ничего не трогать, старые
# export'ы по-прежнему работают и перебивают всё, что здесь написано.
#
# ВАЖНО: настройки WAKEWORD_* (C++ ядро, раунд 14) и настройки
# scripts/start.sh (JARVIS_RUN_DIR/JARVIS_POLL_INTERVAL/... — раунд 19-20)
# сюда сознательно НЕ входят - это bash и C++, у них нет доступа к этому
# файлу. Для них по-прежнему только переменные окружения (см. README).

whisper:
  model_size: small   # tiny/base/small/medium/large-v3 - см. README про выбор размера
  device: cpu
  compute_type: int8

llm:
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-2.5-flash
  site_url: ""        # опционально, для дашборда OpenRouter
  app_name: ""         # опционально, для дашборда OpenRouter

piper:
  model_path: ""       # обязательно для голоса - путь к .onnx модели Piper
  speed: 1.0           # length_scale: >1.0 - медленнее, <1.0 - быстрее
  volume: 1.0

filler:
  phrases: "Секунду.,Так.,Сейчас."   # через запятую; пусто или "off" - выключить
  delay_seconds: 0.35

backend:
  url: http://127.0.0.1:8000/api/v1   # личный бэкенд (погода/курсы/новости)

# Раунд 23 (B6) - опциональный локальный fallback без интернета (LM Studio/
# Ollama/llama-server - любой OpenAI-совместимый локальный сервер). Пусто
# по умолчанию - fallback выключен, поведение как без этого раунда вовсе.
# Заполнить ОБА поля, чтобы включить (частичная настройка игнорируется).
# ВАЖНО: сервер должен быть реально доступен с машины, где крутится
# server.py, по указанному адресу - если LM Studio на отдельном Windows-
# компьютере, base_url должен быть его LAN-адресом (например,
# http://192.168.1.50:1234/v1), а не localhost.
llm_fallback:
  base_url: ""   # например, http://127.0.0.1:1234/v1 (LM Studio) или http://127.0.0.1:11434/v1 (Ollama)
  model: ""      # имя модели, как она видна серверу (например, "gemma-2-12b")

# Раунд 29 (E3) - опциональный "мультиагент": короткие/простые запросы
# пробуются СНАЧАЛА через локальный fallback (llm_fallback выше), тяжёлые -
# сразу через облако, как раньше (раунд 23, B6). Работает, только если
# llm_fallback настроен выше - иначе ничего не меняется относительно B6.
multi_agent:
  routine_max_words: 8   # запрос из <= стольки слов считается "рутиной"
